name: Dev Branch Build Verification

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;34.0.0'

      - name: Add build-tools to $PATH
        run: echo "$ANDROID_HOME/build-tools/34.0.0" >> "$GITHUB_PATH"

      - name: Create google-services.json
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > app/google-services.json

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build Release
        run: |
          ./gradlew assembleRelease \
            -PadminEmail="${{ secrets.ADMIN_EMAIL }}" \
            -PreporterBaseUrl="${{ secrets.REPORTER_BASE_URL }}" \
            -PgoogleClientId="${{ secrets.GOOGLE_CLIENT_ID }}"

      - name: Sign APK
        uses: r0adkll/sign-android-release@v1
        id: sign
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.RELEASE_KEYSTORE }}
          alias: ${{ secrets.RELEASE_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.RELEASE_STORE_PASSWORD }}
          keyPassword: ${{ secrets.RELEASE_KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      - name: Rename and Prepare Artifacts
        run: |
          mv ${{ steps.sign.outputs.signedReleaseFile }} app/build/outputs/apk/release/cukbab-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cukbab-release
          path: app/build/outputs/apk/release/cukbab-release.apk


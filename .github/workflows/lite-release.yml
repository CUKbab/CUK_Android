name: Lite Version Build

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  build-lite:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;34.0.0'

      - name: Add build-tools to $PATH
        run: echo "$ANDROID_HOME/build-tools/34.0.0" >> "$GITHUB_PATH"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build Lite Release APK
        # Pass -PisLite=true to disable Google Services plugin in build.gradle.kts
        run: ./gradlew assembleLiteRelease -PisLite=true

      - name: Sign Lite APK
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: app/build/outputs/apk/lite/release
          signingKeyBase64: ${{ secrets.RELEASE_KEYSTORE }}
          alias: ${{ secrets.RELEASE_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.RELEASE_STORE_PASSWORD }}
          keyPassword: ${{ secrets.RELEASE_KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      - name: Rename Signed APK
        run: mv ${{ steps.sign_app.outputs.signedReleaseFile }} app/build/outputs/apk/lite/release/cuk밥-lite-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cuk밥-lite-release
          path: app/build/outputs/apk/lite/release/cuk밥-lite-release.apk

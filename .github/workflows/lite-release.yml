name: Lite Version Release

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

jobs:
  build-lite:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;34.0.0'

      - name: Add build-tools to $PATH
        run: echo "$ANDROID_HOME/build-tools/34.0.0" >> "$GITHUB_PATH"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build Lite Release APK
        # Pass -PisLite=true to disable Google Services plugin in build.gradle.kts
        run: ./gradlew assembleLiteRelease -PisLite=true

      - name: Sign Lite APK
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: app/build/outputs/apk/lite/release
          signingKeyBase64: ${{ secrets.RELEASE_KEYSTORE }}
          alias: ${{ secrets.RELEASE_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.RELEASE_STORE_PASSWORD }}
          keyPassword: ${{ secrets.RELEASE_KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"
      - name: Rename Signed APK
        run: mv ${{ steps.sign_app.outputs.signedReleaseFile }} app/build/outputs/apk/lite/release/cuk밥-lite-release.apk
      - name: Get Version Name
        id: get_version
        run: |
          VERSION_NAME=$(grep "versionName =" app/build.gradle.kts | cut -d'"' -f2)
          echo "version=$VERSION_NAME" >> $GITHUB_OUTPUT
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.version }}-lite
          name: CUKbab Lite v${{ steps.get_version.outputs.version }}
          body: |
            ## CUKbab Lite Edition
            This is an open-source friendly version of CUKbab with the following changes:
            - **No Firebase:** Completely removed Google Firebase and Google Services dependencies.
            - **Privacy Focused:** Removed all analytics, tracking, and remote reporting features.
            - **Lightweight:** Smaller APK size due to removed libraries.
            - **Feature Note:** Account settings and menu error reporting are disabled in this version.
          files: app/build/outputs/apk/lite/release/cuk밥-lite-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

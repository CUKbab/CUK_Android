name: Dev Branch Build Verification

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  build-variants:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;34.0.0'

      - name: Add build-tools to $PATH
        run: echo "$ANDROID_HOME/build-tools/34.0.0" >> "$GITHUB_PATH"

      - name: Create google-services.json
        # The Full version still needs this to compile on dev
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > app/google-services.json

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build Both Variants
        run: |
          ./gradlew assembleFullRelease
          ./gradlew assembleLiteRelease -PisLite=true

      - name: Sign APKs
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: app/build/outputs/apk/
          signingKeyBase64: ${{ secrets.RELEASE_KEYSTORE }}
          alias: ${{ secrets.RELEASE_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.RELEASE_STORE_PASSWORD }}
          keyPassword: ${{ secrets.RELEASE_KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      - name: Rename and Prepare Artifacts
        run: |
          # Find and rename the signed full APK
          FULL_SIGNED=$(find app/build/outputs/apk/full/release -name "*-signed.apk")
          mv "$FULL_SIGNED" app/build/outputs/apk/full/release/cuk밥-full-release.apk
          
          # Find and rename the signed lite APK
          LITE_SIGNED=$(find app/build/outputs/apk/lite/release -name "*-signed.apk")
          mv "$LITE_SIGNED" app/build/outputs/apk/lite/release/cuk밥-lite-release.apk

      - name: Upload Full APK
        uses: actions/upload-artifact@v4
        with:
          name: cuk밥-full-release
          path: app/build/outputs/apk/full/release/cuk밥-full-release.apk

      - name: Upload Lite APK
        uses: actions/upload-artifact@v4
        with:
          name: cuk밥-lite-release
          path: app/build/outputs/apk/lite/release/cuk밥-lite-release.apk

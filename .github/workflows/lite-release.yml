name: Lite Version Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-lite:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build Lite Release APK
        # Pass -PisLite=true to disable Google Services plugin in build.gradle.kts
        run: ./gradlew assembleLiteRelease -PisLite=true

      - name: Get Version Name
        id: get_version
        run: |
          VERSION_NAME=$(grep "versionName =" app/build.gradle.kts | cut -d'"' -f2)
          echo "version=$VERSION_NAME" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.version }}-lite
          name: CUKbab Lite v${{ steps.get_version.outputs.version }}
          body: |
            ## CUKbab Lite Edition
            This is an open-source friendly version of CUKbab with the following changes:
            - **No Firebase:** Completely removed Google Firebase and Google Services dependencies.
            - **Privacy Focused:** Removed all analytics, tracking, and remote reporting features.
            - **Lightweight:** Smaller APK size due to removed libraries.
            - **Feature Note:** Account settings and menu error reporting are disabled in this version.
          files: app/build/outputs/apk/lite/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: CUKbab Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for the release (e.g., v2.1.0)'
        required: true
        default: 'v2.1.0'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;34.0.0'

      - name: Add build-tools to $PATH
        run: echo "$ANDROID_HOME/build-tools/34.0.0" >> "$GITHUB_PATH"

      - name: Create google-services.json
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > app/google-services.json

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build Variants
        run: |
          ./gradlew assembleFullRelease
          ./gradlew assembleLiteRelease -PisLite=true

      - name: Sign Full APK
        uses: r0adkll/sign-android-release@v1
        id: sign_full
        with:
          releaseDirectory: app/build/outputs/apk/full/release
          signingKeyBase64: ${{ secrets.RELEASE_KEYSTORE }}
          alias: ${{ secrets.RELEASE_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.RELEASE_STORE_PASSWORD }}
          keyPassword: ${{ secrets.RELEASE_KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      - name: Sign Lite APK
        uses: r0adkll/sign-android-release@v1
        id: sign_lite
        with:
          releaseDirectory: app/build/outputs/apk/lite/release
          signingKeyBase64: ${{ secrets.RELEASE_KEYSTORE }}
          alias: ${{ secrets.RELEASE_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.RELEASE_STORE_PASSWORD }}
          keyPassword: ${{ secrets.RELEASE_KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      - name: Prepare APKs
        run: |
          mv ${{ steps.sign_full.outputs.signedReleaseFile }} app/build/outputs/apk/full/release/cuk밥-full-release.apk
          mv ${{ steps.sign_lite.outputs.signedReleaseFile }} app/build/outputs/apk/lite/release/cuk밥-lite-release.apk

      - name: Fetch and Prepare Changelog
        run: |
          # Fetch the latest English changelog from the main CUK repo
          curl -s https://raw.githubusercontent.com/CUKbab/CUK/refs/heads/main/changelogs/en.md > release_notes.md
          
          # Append the Lite version explanation
          echo -e "\n---\n## CUKbab Lite Edition\nThis is an open-source friendly version of CUKbab with the following changes:\n- **No Firebase:** Completely removed Google Firebase and Google Services dependencies.\n- **Privacy Focused:** Removed all analytics, tracking, and remote reporting features.\n- **Lightweight:** Smaller APK size due to removed libraries.\n- **Feature Note:** Account settings and menu error reporting are disabled in this version." >> release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || format('v{0}', github.sha) }}
          name: ${{ github.event.inputs.tag_name && format('Release {0}', github.event.inputs.tag_name) || format('Release {0}', github.sha) }}
          body_path: release_notes.md
          files: |
            app/build/outputs/apk/full/release/cuk밥-full-release.apk
            app/build/outputs/apk/lite/release/cuk밥-lite-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: CUK밥 Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for the release (e.g., v2.1.0)'
        required: true
        default: 'v2.1.0'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;34.0.0'

      - name: Add build-tools to $PATH
        run: echo "$ANDROID_HOME/build-tools/34.0.0" >> "$GITHUB_PATH"

      - name: Create google-services.json
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > app/google-services.json

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build Release
        run: |
          ./gradlew assembleRelease \
            -PadminEmail="${{ secrets.ADMIN_EMAIL }}" \
            -PreporterBaseUrl="${{ secrets.REPORTER_BASE_URL }}" \
            -PgoogleClientId="${{ secrets.GOOGLE_CLIENT_ID }}"

      - name: Sign APK
        uses: r0adkll/sign-android-release@v1
        id: sign
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.RELEASE_KEYSTORE }}
          alias: ${{ secrets.RELEASE_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.RELEASE_STORE_PASSWORD }}
          keyPassword: ${{ secrets.RELEASE_KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      - name: Prepare APKs
        run: |
          mv ${{ steps.sign.outputs.signedReleaseFile }} app/build/outputs/apk/release/cukbab-release.apk

      - name: Get version name
        id: get_version
        run: |
          VERSION=$(grep "versionName =" app/build.gradle.kts | awk -F'"' '{print $2}')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Fetch and Prepare Changelog
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          # Fetch the latest English changelog from the main CUK repo
          curl -sf https://raw.githubusercontent.com/CUKbab/CUK/refs/heads/main/changelogs/en/${VERSION}.md > release_notes.md \
            || echo "Release ${VERSION}" > release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || format('v{0}', steps.get_version.outputs.VERSION) }}
          name: ${{ github.event.inputs.tag_name && format('Release {0}', github.event.inputs.tag_name) || format('Release {0}', steps.get_version.outputs.VERSION) }}
          body_path: release_notes.md
          files: |
            app/build/outputs/apk/release/cukbab-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
